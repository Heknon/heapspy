[project]
name = "heapspy-e2e"
version = "0"
description = "End-to-end tests: heapspy against real CPython processes with known leaks"
requires-python = ">=3.10"
dependencies = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["."]
markers = [
    "mcp: smoke test against a heapspy-mcp checkout (needs HEAPSPY_MCP_DIR)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["harness", "expectations"]
