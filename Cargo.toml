[workspace]
resolver = "2"
members = [
    "crates/heapspy-snapshot",
    "crates/heapspy-alloc",
    "crates/heapspy-reader",
    "crates/heapspy-record",
    "crates/heapspy-analyzer",
    "crates/heapspy",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/Heknon/heapspy"

[workspace.dependencies]
heapspy-snapshot = { path = "crates/heapspy-snapshot", version = "0.1.1" }
heapspy-alloc = { path = "crates/heapspy-alloc", version = "0.1.1" }
heapspy-reader = { path = "crates/heapspy-reader", version = "0.1.1" }
heapspy-record = { path = "crates/heapspy-record", version = "0.1.1" }
heapspy-analyzer = { path = "crates/heapspy-analyzer", version = "0.1.1" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Only the SVG renderer: no CLI, no threads, no name-attribute files.
inferno = { version = "0.12.8", default-features = false }
libc = "0.2"
memmap2 = "0.9"
object = { version = "0.37", default-features = false, features = ["std", "read_core", "elf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
