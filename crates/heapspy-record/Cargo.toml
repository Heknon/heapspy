[package]
name = "heapspy-record"
description = "heapspy record: sample allocations of a running CPython process with their Python stacks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
heapspy-alloc.workspace = true
heapspy-reader.workspace = true
heapspy-snapshot.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
object.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_System_Diagnostics_Etw", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Time", "Wdk_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
