[package]
name = "heapspy"
description = "Find what keeps memory alive in a CPython process, from the outside"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "heapspy"
path = "src/main.rs"

[dependencies]
heapspy-snapshot.workspace = true
heapspy-reader.workspace = true
heapspy-analyzer.workspace = true
heapspy-alloc.workspace = true
heapspy-record.workspace = true
anyhow.workspace = true
clap.workspace = true
inferno.workspace = true
serde.workspace = true
serde_json.workspace = true
ratatui = "0.29"
crossterm = "0.28"
tempfile.workspace = true
# HTTP for `agent`. TLS (rustls, with ring) is the `tls` feature, on by
# default; without it only http:// servers can be used.
ureq = { version = "2.12", default-features = false }

[features]
default = ["tls"]
tls = ["ureq/tls"]

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc.workspace = true
