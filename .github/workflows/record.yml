# Live `heapspy record` tests: real CPython 3.12, 3.13 and 3.14 processes,
# recorded through every mechanism, on Linux and Windows. Runs on request
# only. See CONTRIBUTING.md.
#
#   - Label a PR `ci:record` to run both jobs.
#   - Every release (release.yml) runs both.
#   - Manual dispatch runs both, or one side with `side: linux|windows`.
#
# Linux runs the ignored tests that need root (record_live, cpython_live,
# live_stack) as root. If the runner's kernel cannot run the eBPF
# recorder, the ptrace tests still run and the job summary says which eBPF
# tests were skipped and why. Windows runs record_live_windows (ETW and the
# debugger); GitHub's Windows runners are elevated.
name: Record

on:
  workflow_dispatch:
    inputs:
      side:
        description: "Which side to run"
        type: choice
        options: [both, linux, windows]
        default: both
  # release.yml runs this on every release commit, before publishing.
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  # A literal prefix, not github.workflow: under workflow_call that is the
  # caller's name. Only superseded pull-request runs are cancelled.
  group: record-${{ github.ref }}-${{ inputs.side || 'both' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: record (ubuntu)
    # On a `labeled` event, only react to the label this workflow cares
    # about, so adding unrelated labels does not start a run.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.side != 'windows') ||
      github.event_name == 'push' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:record') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci:record'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: record
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tests/e2e/uv.lock
      - name: Install gdb (gcore, for the cpython_live core tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb
      - name: Install Python 3.12, 3.13, 3.14 (python-build-standalone)
        run: |
          uv python install 3.12 3.13 3.14
          for v in 12 13 14; do
            py="$(uv python find --python-preference only-managed "3.$v")"
            "$py" -VV
            echo "HEAPSPY_PY3$v=$py" >>"$GITHUB_ENV"
          done
      - name: Build the tests
        run: |
          set -o pipefail
          cargo test --locked --no-run --message-format=json \
              -p heapspy --test record_live --test cpython_live \
              -p heapspy-record --test live_stack |
            jq -r 'select(.profile.test == true and .executable != null)
                   | "\(.target.name)=\(.executable)"' >"$RUNNER_TEMP/tests.txt"
          cat "$RUNNER_TEMP/tests.txt"
          for t in record_live cpython_live live_stack; do
            exe="$(grep "^$t=" "$RUNNER_TEMP/tests.txt" | cut -d= -f2-)"
            test -x "$exe"
            echo "TEST_${t^^}=$exe" >>"$GITHUB_ENV"
          done
          echo "HEAPSPY_BIN=$PWD/target/debug/heapspy" >>"$GITHUB_ENV"
      - name: Kernel features for heapspy record
        id: kernel
        run: |
          # Ubuntu's sudo ignores -E: pass what root needs explicitly.
          sudo env "GITHUB_OUTPUT=$GITHUB_OUTPUT" "PATH=$PATH" \
              scripts/record-kernel-check.sh "$HEAPSPY_BIN" "$HEAPSPY_PY313" |
            tee "$RUNNER_TEMP/kernel.txt"
          {
            echo "### Kernel"
            echo '```'
            cat "$RUNNER_TEMP/kernel.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: record_live (eBPF and ptrace, as root)
        env:
          EBPF: ${{ steps.kernel.outputs.ebpf }}
          EBPF_REASON: ${{ steps.kernel.outputs.ebpf_reason }}
        run: |
          set -o pipefail
          case "$EBPF" in
            true | false) ;;
            *) echo "::error::the kernel check gave no answer"; exit 1 ;;
          esac
          asroot() {
            sudo env "HEAPSPY_PY312=$HEAPSPY_PY312" "HEAPSPY_PY313=$HEAPSPY_PY313" \
                "HEAPSPY_PY314=$HEAPSPY_PY314" "PATH=$PATH" "$@"
          }
          # Without eBPF, run only the ptrace tests (their names say so).
          filter=()
          if [ "$EBPF" != true ]; then filter=(ptrace); fi
          listed="$("$TEST_RECORD_LIVE" --ignored --list "${filter[@]}" | grep -c ': test$')"
          ptrace="$("$TEST_RECORD_LIVE" --ignored --list ptrace | grep -c ': test$')"
          status=0
          asroot "$TEST_RECORD_LIVE" --ignored --test-threads 1 "${filter[@]}" |
            tee "$RUNNER_TEMP/record_live.txt" || status=$?
          passed="$(sed -n 's/^test result: ok\. \([0-9]*\) passed.*/\1/p' "$RUNNER_TEMP/record_live.txt")"
          {
            echo "### record_live"
            echo "- passed: ${passed:-0} of $listed selected (ptrace tests: $ptrace)"
            if [ "$EBPF" = true ]; then
              echo "- eBPF tests: ran"
            else
              echo "- eBPF tests: **skipped**: ${EBPF_REASON}"
              "$TEST_RECORD_LIVE" --ignored --list | grep ': test$' | grep -v ptrace |
                sed 's/: test$//; s/^/  - skipped: /'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$EBPF" != true ]; then
            echo "::warning::eBPF record tests skipped: $EBPF_REASON"
          fi
          # Never pass with nothing run: every selected test, and at least
          # the ptrace ones, must have passed.
          test "$status" -eq 0
          test "$ptrace" -ge 5
          test "${passed:-0}" -eq "$listed"
          test "$listed" -ge "$ptrace"
      - name: cpython_live and live_stack (ptrace, as root)
        run: |
          set -o pipefail
          asroot() {
            sudo env "HEAPSPY_PY312=$HEAPSPY_PY312" "HEAPSPY_PY313=$HEAPSPY_PY313" \
                "HEAPSPY_PY314=$HEAPSPY_PY314" "PATH=$PATH" "$@"
          }
          for t in TEST_CPYTHON_LIVE TEST_LIVE_STACK; do
            exe="${!t}"
            listed="$("$exe" --ignored --list | grep -c ': test$')"
            status=0
            asroot "$exe" --ignored --test-threads 1 | tee "$RUNNER_TEMP/out.txt" || status=$?
            passed="$(sed -n 's/^test result: ok\. \([0-9]*\) passed.*/\1/p' "$RUNNER_TEMP/out.txt")"
            echo "- $(basename "$exe" | sed 's/-[0-9a-f]*$//'): ${passed:-0} of $listed passed" >>"$GITHUB_STEP_SUMMARY"
            test "$status" -eq 0
            test "$listed" -gt 0
            test "${passed:-0}" -eq "$listed"
          done

  windows:
    name: record (windows)
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.side != 'linux') ||
      github.event_name == 'push' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:record') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci:record'))
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: record
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tests/e2e/uv.lock
      - name: Check elevation and ETW sessions
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.VersionString
          $p = [Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()
          if (-not $p.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            Write-Error "the runner is not elevated; heapspy record needs that"
            exit 1
          }
          "elevated: yes"
          # The session list is for the log only. logman can fail when a
          # session on the runner ends while it is listing them ("The GUID
          # passed was not recognized as valid by a WMI data provider"); that
          # says nothing about heapspy, so it does not fail the job.
          logman query -ets
          if ($LASTEXITCODE -ne 0) { "logman query -ets failed ($LASTEXITCODE); continuing" }
          exit 0
      - name: Install Python 3.12, 3.13, 3.14 (python-build-standalone)
        run: |
          uv python install 3.12 3.13 3.14
          for v in 12 13 14; do
            py="$(uv python find --python-preference only-managed "3.$v")"
            "$py" -VV
            echo "HEAPSPY_PY3$v=$py" >>"$GITHUB_ENV"
          done
      - name: Build the tests
        run: cargo test --locked --no-run -p heapspy --test record_live_windows
      - name: record_live_windows (ETW and debugger)
        run: |
          set -o pipefail
          listed="$(cargo test --locked -q -p heapspy --test record_live_windows -- --ignored --list | grep -c ': test$')"
          status=0
          cargo test --locked -p heapspy --test record_live_windows -- \
              --ignored --test-threads 1 --nocapture 2>&1 |
            tee "$RUNNER_TEMP/record_live_windows.txt" || status=$?
          passed="$(sed -n 's/^test result: [A-Za-z]*\. \([0-9]*\) passed.*/\1/p' "$RUNNER_TEMP/record_live_windows.txt")"
          {
            echo "### record_live_windows"
            echo "- passed: ${passed:-0} of $listed"
            echo '```'
            grep -E '^(RESULT|SKIPPED|       #)' "$RUNNER_TEMP/record_live_windows.txt" || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          test "$status" -eq 0
          test "$listed" -gt 0
          test "${passed:-0}" -eq "$listed"
      - name: ETW sessions after the tests
        if: always()
        shell: pwsh
        run: |
          logman query -ets
          if ($LASTEXITCODE -ne 0) { "logman query -ets failed ($LASTEXITCODE); continuing" }
          exit 0
