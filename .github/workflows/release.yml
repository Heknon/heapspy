# Builds and publishes a release. See docs/releasing.md.
#
# Releasing is a version bump. Raise `[workspace.package] version` in
# Cargo.toml (and python/heapspy-mcp's version to match), merge to master,
# and the release runs itself:
#
#   1. gate: a push to master whose version has no vX.Y.Z tag yet is a
#      release. Any other push to master stops here.
#   2. ci.yml, e2e.yml and record.yml run on the release commit
#      (workflow_call), so nothing is published that they would refuse.
#   3. heapspy wheels, sdist, binaries and heapspy-mcp are built.
#   4. both packages are published to PyPI with trusted publishing. The job
#      runs in the `pypi` environment, which records a GitHub deployment.
#   5. the commit is tagged vX.Y.Z and the GitHub release is created with the
#      binaries and SHA256SUMS.
#
# Pushing a tag vX.Y.Z by hand still works and goes through the same steps.
# Manual dispatch builds everything; with `publish: testpypi` it also uploads
# to TestPyPI. It never publishes to PyPI or creates a release.
#
# The tag is pushed with this workflow's own token, which does not start other
# workflows, so tagging does not run the tests a second time.
name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Where to upload the built packages"
        type: choice
        options:
          - none
          - testpypi
        default: none

# Two merges in quick succession release one after the other, never at once,
# and a run that may be halfway through publishing is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: anything to release?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.gate.outputs.release }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Is the Cargo.toml version tagged yet?
        id: gate
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          version=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A tag push or a manual dispatch builds by definition.
          if [ "$EVENT" != push ] || [ "$REF_TYPE" = tag ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git ls-remote --exit-code origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released and this push does not bump the version: nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version has no tag yet: releasing it."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI
    needs: gate
    if: needs.gate.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  e2e:
    name: E2E
    needs: gate
    if: needs.gate.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      mcp_ref: ${{ github.sha }}

  record:
    name: Record
    needs: gate
    if: needs.gate.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/record.yml

  check-version:
    name: check versions
    needs: [gate, ci, e2e, record]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      has_mcp: ${{ steps.mcp.outputs.has_mcp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag and package versions
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            python scripts/check-version.py "$REF_NAME"
          else
            python scripts/check-version.py
          fi
      - name: An existing tag for this version must be on this commit
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          # Checked here, before the publish that PyPI will not let us undo.
          at=$(git ls-remote origin "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}" | awk 'END {print $1}')
          if [ -n "$at" ] && [ "$at" != "$GITHUB_SHA" ]; then
            echo "::error::v$VERSION is already on $at, not on the commit this run would publish ($GITHUB_SHA)"
            exit 1
          fi
      - name: Look for python/heapspy-mcp
        id: mcp
        run: |
          if [ -f python/heapspy-mcp/pyproject.toml ]; then
            echo "has_mcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_mcp=false" >> "$GITHUB_OUTPUT"
            echo "python/heapspy-mcp not found; the heapspy-mcp job will be skipped."
          fi

  wheels:
    name: wheel (${{ matrix.target }})
    needs: [gate, check-version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            smoke-test: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            smoke-test: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            smoke-test: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ""
            smoke-test: true
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - uses: actions/setup-python@v5
        if: matrix.smoke-test
        with:
          python-version: "3.12"
      - name: Install the wheel and run heapspy --version
        if: matrix.smoke-test
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist heapspy
          heapspy --version
      - name: Package the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EVENT: ${{ github.event_name }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          # Releases (tag pushes and version bumps on master) name the binary
          # after the version; dispatch builds are dev builds.
          if [ "$EVENT" = "push" ]; then
            name="heapspy-v$VERSION-$TARGET"
          else
            name="heapspy-dev-${GITHUB_SHA::7}-$TARGET"
          fi
          bindir="target/$TARGET/release"
          mkdir -p bin-dist
          if [ -f "$bindir/heapspy.exe" ]; then
            7z a -tzip "bin-dist/$name.zip" "./$bindir/heapspy.exe" README.md LICENSE
          else
            tar czf "bin-dist/$name.tar.gz" -C "$bindir" heapspy -C "$GITHUB_WORKSPACE" README.md LICENSE
          fi
          ls -l bin-dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: bin-dist/*
          if-no-files-found: error

  sdist:
    name: sdist (heapspy)
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  mcp:
    name: sdist and wheel (heapspy-mcp)
    needs: check-version
    # Skipped (not failed) on commits that do not contain the package yet.
    if: needs.check-version.outputs.has_mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build python/heapspy-mcp --out-dir dist-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-dist
          path: dist-mcp/*
          if-no-files-found: error

  publish-pypi:
    name: publish to PyPI
    needs: [gate, check-version, wheels, sdist, mcp]
    # `mcp` may be skipped, which would skip this job too without the
    # explicit result checks. Only release pushes publish: a version bump
    # merged to master, or a tag pushed by hand.
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      needs.gate.outputs.release == 'true' &&
      needs.check-version.result == 'success' &&
      needs.wheels.result == 'success' &&
      needs.sdist.result == 'success' &&
      (needs.mcp.result == 'success' || needs.mcp.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/heapspy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: needs.mcp.result == 'success'
        with:
          name: mcp-dist
          path: dist-mcp
      - run: ls -l dist dist-mcp 2>/dev/null || ls -l dist
      # skip-existing lets a release that stopped partway resume: if
      # heapspy was uploaded and heapspy-mcp was refused, the next release
      # push skips the heapspy files PyPI already has and uploads the rest.
      # PyPI never replaces a file, so a skipped file stays as first built.
      - name: Publish heapspy
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
      - name: Publish heapspy-mcp
        if: needs.mcp.result == 'success'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-mcp
          skip-existing: true

  publish-testpypi:
    name: publish to TestPyPI
    needs: [check-version, wheels, sdist, mcp]
    if: >-
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish == 'testpypi' &&
      needs.check-version.result == 'success' &&
      needs.wheels.result == 'success' &&
      needs.sdist.result == 'success' &&
      (needs.mcp.result == 'success' || needs.mcp.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/heapspy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: needs.mcp.result == 'success'
        with:
          name: mcp-dist
          path: dist-mcp
      - run: ls -l dist dist-mcp 2>/dev/null || ls -l dist
      # TestPyPI, like PyPI, never accepts the same file twice. skip-existing
      # lets a second dispatch of an unchanged version pass.
      - name: Publish heapspy
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true
      - name: Publish heapspy-mcp
        if: needs.mcp.result == 'success'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist-mcp
          skip-existing: true

  github-release:
    name: tag and GitHub release
    needs: [gate, wheels, publish-pypi]
    # Runs after PyPI accepted the upload, so a failed publish leaves no tag
    # and no release behind.
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the published commit
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          at=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | awk 'END {print $1}')
          if [ -n "$at" ]; then
            if [ "$at" != "$GITHUB_SHA" ]; then
              echo "::error::$tag is already on $at, not on the commit this run published ($GITHUB_SHA)"
              exit 1
            fi
            echo "$tag already exists on this commit (tag-push path)"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "heapspy $VERSION"
            git push origin "$tag"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release
          merge-multiple: true
      - name: Write checksums
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
