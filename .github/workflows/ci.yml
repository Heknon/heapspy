# CI runs on request only. See CONTRIBUTING.md.
#
#   - Label a PR `ci` to run fmt, clippy and tests on Linux.
#   - Label a PR `ci:windows` to run the tests on Windows.
#   - Every release (release.yml) and manual dispatch run both jobs.
name: CI

on:
  workflow_dispatch:
  # release.yml runs this on every release commit, before publishing.
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  # A literal prefix, not github.workflow: when release.yml calls this file,
  # github.workflow is "Release" for every called workflow, and they would
  # cancel each other. Only superseded pull-request runs are cancelled.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (ubuntu)
    # On a `labeled` event, only react to the label this job cares about,
    # so adding unrelated labels does not start a run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (contains(github.event.pull_request.labels.*.name, 'ci') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The musl wheel is a release target; libc's signatures differ there.
      - name: cargo clippy (musl)
        run: cargo clippy --workspace --all-targets --target x86_64-unknown-linux-musl -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  windows:
    name: test (windows)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:windows') &&
       (github.event.action != 'labeled' || github.event.label.name == 'ci:windows'))
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace
